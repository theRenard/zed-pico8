id = "pico8"
name = "PICO-8"
description = "PICO-8 support: .p8 syntax highlighting, API snippets, and optional Lua language server."
version = "0.1.0"
schema_version = 1
authors = ["theRenard"]
repository = "https://github.com/theRenard/zed-pico8"

snippets = ["./snippets/pico-8.json"]

[grammars.lua]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-lua"
rev = "10fe0054734eec83049514ea2e718b2a56acd0c9"

[language_servers.pico8-luals]
name = "LuaLS (PICO-8)"
languages = ["PICO-8"]
opt_in_languages = ["PICO-8"]

[language_servers.pico8-luals.language_ids]
"PICO-8" = "lua"
