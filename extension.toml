id = "pico8"
name = "PICO-8"
description = "PICO-8 support: .p8 syntax highlighting, API snippets, and PICO-8 language server."
version = "0.2.2"
schema_version = 1
authors = ["theRenard"]
repository = "https://github.com/theRenard/zed-pico8"

snippets = ["./snippets/pico-8.json"]

[grammars.lua]
# Fork of tree-sitter-grammars/tree-sitter-lua that accepts PICO-8 string escapes (\^, \*, ...).
repository = "https://github.com/theRenard/tree-sitter-lua"
rev = "e396d05d94b9c5dba51d6f362b8dfc8a21a684da"

[language_servers.pico8-ls]
name = "PICO-8 LS"
languages = ["PICO-8"]

[language_servers.pico8-ls.language_ids]
"PICO-8" = "pico-8"
