name = "PICO-8"
grammar = "lua"
path_suffixes = ["p8"]
first_line_pattern = "^pico-8 cartridge"
line_comments = ["-- "]
block_comment = ["--[[", "]]"]
tab_size = 1
hard_tabs = false
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
]
increase_indent_pattern = "^\\s*(if|elseif|else|do|while|for|repeat|function|local\\s+function|.+=\\s*function|.*[,(]\\s*function)\\b"
decrease_indent_pattern = "^\\s*(elseif|else|end|until)\\b"
